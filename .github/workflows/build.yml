name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  ODYPLAN_VERSION: "v0.6.1.8"
  ODYPLAN_ROOT: ${{ github.workspace }}/odyplan-install
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install CMake 4.1
        run: |
          pip install cmake==4.1.0
          echo "$(python -m site --user-base)/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libstdc++-14-dev \
            libzstd-dev \
            zstd \
            ninja-build \
            libspdlog-dev \
            nlohmann-json3-dev \
            libfmt-dev \
            libffi-dev \
            libedit-dev \
            libcurl4-openssl-dev

      - name: Remove system LLVM/Clang
        run: |
          sudo apt-get remove -y llvm* clang* libclang*
          sudo apt-get autoremove -y

      - name: Install LLVM 22
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 all

          echo "/usr/bin" >> $GITHUB_PATH
          echo "LLVM_CONFIG=/usr/bin/llvm-config-22" >> $GITHUB_ENV

      - name: Verify toolchain
        run: |
          clang-tidy-22 --version
          clang++-22 --version
          llvm-config-22 --version
          cmake --version  

      - name: Download OdyPlan
        env:
          ODYPLAN_TOKEN: ${{ secrets.odycompiler }}
          ODYPLAN_VERSION: ${{ env.ODYPLAN_VERSION }}
        run: |
          ASSET_NAME="odyplan-${ODYPLAN_VERSION}-linux-x86_64.tar.gz"
          echo "Downloading ${ASSET_NAME}..."
          
          wget -q \
            --header="Authorization: Bearer ${ODYPLAN_TOKEN}" \
            "https://github.com/SlepiK/OdyPlan/releases/download/${ODYPLAN_VERSION}/${ASSET_NAME}" \
            -O odyplan.tar.gz
          
          echo "Download complete!"
          ls -la odyplan.tar.gz

      - name: Extract OdyPlan
        run: |
          mkdir -p ${{ env.ODYPLAN_ROOT }}
          tar -xzf odyplan.tar.gz -C ${{ env.ODYPLAN_ROOT }} --strip-components=1
          rm odyplan.tar.gz
          
          echo "OdyPlan extracted to ${{ env.ODYPLAN_ROOT }}"
          ls -la ${{ env.ODYPLAN_ROOT }}

      - name: Setup OdyPlan environment
        run: |
          echo "OdyPlan_DIR=${{ env.ODYPLAN_ROOT }}/lib64/cmake/OdyPlan" >> $GITHUB_ENV
          echo "ODYPLAN_ROOT=${{ env.ODYPLAN_ROOT }}" >> $GITHUB_ENV

      - name: Configure OdyCompiler
        run: |
          cmake -S . -B cmake-build-debug -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DOdyPlan_ROOT=${{ env.ODYPLAN_ROOT }} \
            -DLLVM_DIR=${{ env.LLVM_DIR }}/lib/cmake/llvm \
            -DCMAKE_PREFIX_PATH="${{ env.ODYPLAN_ROOT }};${{ env.LLVM_DIR }}"

      - name: Build OdyCompiler
        run: |
          cmake --build cmake-build-debug --target odycompiler_example_plan -j$(nproc)

      - name: Build Examples
        run: cmake --build build --target odycompiler_example_all

      - name: Run tests
        run: |
          cd cmake-build-debug
          ctest -R odycompiler_example --output-on-failure -j$(nproc)