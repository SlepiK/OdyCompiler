name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  ODYPLAN_VERSION: "v0.6.1.8"
  ODYPLAN_ROOT: ${{ github.workspace }}/odyplan-install
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install CMake 4.1
        run: |
          pip install cmake==4.1.0
          echo "$(python -m site --user-base)/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libstdc++-14-dev \
            libzstd-dev \
            zstd \
            ninja-build \
            libspdlog-dev \
            nlohmann-json3-dev \
            libfmt-dev \
            libffi-dev \
            libedit-dev \
            libcurl4-openssl-dev

      - name: Remove system LLVM/Clang
        run: |
          sudo apt-get remove -y llvm* clang* libclang*
          sudo apt-get autoremove -y

      - name: Install LLVM 22
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22 all

          echo "/usr/bin" >> $GITHUB_PATH
          echo "LLVM_DIR=$(llvm-config-22 --cmakedir)" >> $GITHUB_ENV

      - name: Verify toolchain
        run: |
          clang-tidy-22 --version
          clang++-22 --version
          llvm-config-22 --version
          cmake --version  
          echo "LLVM_DIR: ${LLVM_DIR}"

      - name: Copy OdyPlan from Repo
        run: |
          TARBALL="dependencies/odyplan-${{ env.ODYPLAN_VERSION }}-linux-x86_64.tar.gz"
            
          echo "Checking for ${TARBALL}..."
          if [ ! -f "${TARBALL}" ]; then
            echo "ERROR: ${TARBALL} not found!"
            echo "Available files in dependencies/:"
            ls -la dependencies/ 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi
            
          echo "Found ${TARBALL}"
          cp "${TARBALL}" odyplan.tar.gz

      - name: Extract OdyPlan
        run: |
          mkdir -p ${{ env.ODYPLAN_ROOT }}
          tar -xzf odyplan.tar.gz -C ${{ env.ODYPLAN_ROOT }} --strip-components=1
          rm odyplan.tar.gz
                
          echo "OdyPlan extracted to ${{ env.ODYPLAN_ROOT }}"
          ls -la ${{ env.ODYPLAN_ROOT }}

      - name: Setup OdyPlan environment
        run: |
          echo "OdyPlan_DIR=${{ env.ODYPLAN_ROOT }}/lib64/cmake/OdyPlan" >> $GITHUB_ENV
          echo "ODYPLAN_ROOT=${{ env.ODYPLAN_ROOT }}" >> $GITHUB_ENV

      - name: Configure OdyCompiler
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DOdyPlan_ROOT=${{ env.ODYPLAN_ROOT }} \

      - name: Build OdyCompiler
        run: |
          cmake --build build --target odycompiler -j$(nproc)

      - name: Build Examples
        run: cmake --build build --target odycompiler_example_all

      - name: Run tests
        run: |
          cd build
          ctest -R odycompiler_example --output-on-failure -j$(nproc)